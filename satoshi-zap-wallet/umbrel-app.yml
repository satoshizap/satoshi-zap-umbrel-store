manifestVersion: 1.1
id: satoshi-zap-wallet
icon: https://raw.githubusercontent.com/satoshizap/satoshi-zap-umbrel-store/main/satoshi-zap-wallet/icon.svg
category: bitcoin
name: SatoshiZap
version: "1.2.180"
port: 3020
tagline: Smart Bitcoin Lightning wallet and gateway
description: >
  Satoshi Zap is an advanced, highly optimized self-hosted Bitcoin Lightning wallet and dashboard.
  It offers full integration with your LNbits instance and direct connections to leading global and European exchanges (Coinmate, Bybit, Strike, Coinbase, Binance) for high-speed fiat-to-bitcoin purchases and submarine swaps (via Boltz.exchange).
  
  The application features a built-in smart AI assistant (Google Gemini) that automatically classifies your transactions, cleans up merchant names, and answers questions about your spending in CZK, EUR, or USD. Runs natively as a Progressive Web App (PWA).
developer: SatoshiZap
website: https://github.com/satoshizap/satoshi-zap-umbrel-store
environment:
  - APP_HOST
  - APP_PORT
  - PROXY_AUTH_ADD
dependencies:
  - lnbits
repo: https://github.com/satoshizap/satoshi-zap-umbrel-store
support: https://github.com/satoshizap/satoshi-zap-umbrel-store
gallery:
  - https://raw.githubusercontent.com/satoshizap/satoshi-zap-umbrel-store/main/satoshi-zap-wallet/gallery/1.png
path: "admin"
defaultPassword: ""
releaseNotes: >
  v1.2.180. Doladěny vertikální mezery u tlačítek MAX a popisků minimální částky.
  v1.2.180. Fine-tuned vertical spacing for MAX buttons and minimum amount notes.
  v1.2.179. Sjednocen design tlačítek MAX pro směnu a výběr.
  v1.2.179. Unified design of MAX buttons for exchange and withdrawal.
  v1.2.178. Oprava mobilního scrollování layoutu s tlačítkem MAX.
  v1.2.178. Fixed mobile layout scrolling with MAX button.
  v1.2.177. Nativní inkluzivní poplatky pro Strike Lightning a tlačítko MAX pro výběr.
  v1.2.177. Native inclusive fees for Strike Lightning and MAX button for withdrawals.
  v1.2.173. Oprava vycentrování vykřičníku v offline ikonách.
  v1.2.173. Centered exclamation mark inside warning/offline icons.
  v1.2.172. Oprava duplicitních ntfy notifikací pomocí persistentní sdílené cache.
  v1.2.172. Fixed duplicate ntfy notifications using a persistent shared cache.
  v1.2.171. Přidána sada unit testů. Zkrácen interval hlídání Nostr relé na 60s. Omezeno minimální vyžadované množství Coinmate Lightning výběru na 1000 sats (bez ovlivnění jiných peněženek).
  v1.2.171. Added unit test suite. Shortened Nostr relay health check to 60s. Enforced 1000 sats minimum Coinmate Lightning withdrawal limit (other wallets unaffected).
submitter: SatoshiZap
submission: https://github.com/satoshizap/satoshi-zap-umbrel-store
