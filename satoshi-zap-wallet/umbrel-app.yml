manifestVersion: 1.1
id: satoshi-zap-wallet
icon: https://raw.githubusercontent.com/satoshizap/satoshi-zap-umbrel-store/main/satoshi-zap-wallet/icon.svg
category: bitcoin
name: SatoshiZap
version: "1.2.170"
port: 3020
tagline: Smart Bitcoin Lightning wallet and gateway
description: >
  Satoshi Zap is an advanced, highly optimized self-hosted Bitcoin Lightning wallet and dashboard.
  It offers full integration with your LNbits instance and direct connections to leading global and European exchanges (Coinmate, Bybit, Strike, Coinbase, Binance) for high-speed fiat-to-bitcoin purchases and submarine swaps (via Boltz.exchange).
  
  The application features a built-in smart AI assistant (Google Gemini) that automatically classifies your transactions, cleans up merchant names, and answers questions about your spending in CZK, EUR, or USD. Runs natively as a Progressive Web App (PWA).
developer: SatoshiZap
website: https://github.com/satoshizap/satoshi-zap-umbrel-store
environment:
  - APP_HOST
  - APP_PORT
  - PROXY_AUTH_ADD
dependencies:
  - lnbits
repo: https://github.com/satoshizap/satoshi-zap-umbrel-store
support: https://github.com/satoshizap/satoshi-zap-umbrel-store
gallery:
  - https://raw.githubusercontent.com/satoshizap/satoshi-zap-umbrel-store/main/satoshi-zap-wallet/gallery/1.png
path: "admin"
defaultPassword: ""
releaseNotes: >
  v1.2.170. Přidána sada unit testů. Zkrácen interval hlídání a obnovení spojení k Nostr relé na 60 sekund. Nastavena minimální částka pro Coinmate Lightning výběry na 1000 sats.
  v1.2.170. Added unit test suite. Optimized Nostr relay health check and reconnection interval to 60 seconds. Set minimum Coinmate Lightning withdrawal limit to 1000 sats.
submitter: SatoshiZap
submission: https://github.com/satoshizap/satoshi-zap-umbrel-store
